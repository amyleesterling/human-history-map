# Publishes the site to GitHub Pages on every push to main. There is nothing
# to build: the job copies the files a visitor needs into _site (the two
# pages, the stylesheet, the modules, the vendored libraries, the base
# geography and the data; not the scripts, the tooling or the Wikipedia
# cache) and hands the folder to Pages. configure-pages turns Pages on the
# first time so no one has to click through Settings.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the data
        run: node scripts/validate.mjs --strict
      - name: Assemble the site
        run: |
          mkdir -p _site
          cp -r index.html civ.html site.css favicon.svg .nojekyll js vendor base data _site/
          du -sh _site
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
