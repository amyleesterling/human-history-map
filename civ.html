<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Human History Map</title>
<meta name="description" content="What one kingdom or civilization made: its inventions, science, arts and ideas, when it fell and to whom.">
<meta name="theme-color" content="#0b1220">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="preload" href="vendor/fonts/cinzel/cinzel-600-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="vendor/fonts/eb-garamond/eb-garamond-400-italic-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="vendor/scifi-ui/hologram.css">
<link rel="stylesheet" href="vendor/scifi-ui/panel-surface.css">
<link rel="stylesheet" href="site.css?v=cards-4">
</head>
<body class="card">

<header class="bar">
  <a class="brand holounder" href="./">Human History Map</a>
  <div class="bar-tools">
    <a id="globeLink" class="chip" href="./">On the globe</a>
    <button id="shareBtn" class="chip" type="button" title="Share this page">Share</button>
  </div>
</header>

<main class="wrap" id="card">
  <p class="crumbs"><a href="./">Globe</a> / <span id="crumbYear" class="num"></span></p>
  <h1 id="name"><span class="swatch" id="swatch" aria-hidden="true"></span><span id="nameText">Loading</span></h1>
  <p class="dates num" id="dates"></p>
  <ul class="facts" id="facts"></ul>

  <div class="hero holopanel" id="hero">
    <a class="minimap" id="minimapLink" href="./" aria-label="Open this polity on the interactive globe"><canvas id="minimap"></canvas></a>
    <div class="hero-foot"><span id="heroCaption"></span><a class="btn" id="heroOpen" href="./">Open on the globe</a></div>
  </div>
  <div class="lifebar" id="lifebar" aria-hidden="true"><canvas id="lifebarCanvas"></canvas></div>

  <p class="lead" id="lead"></p>
  <div id="sections"></div>
  <section id="fallSection" hidden>
    <h2>The end</h2>
    <div class="fall holopanel"><div id="fallText"></div><div class="to" id="fallTo"></div></div>
  </section>
  <section id="chainSection" hidden>
    <h2>Before and after</h2>
    <div class="chain" id="chain"></div>
  </section>
  <section id="sourcesSection" hidden>
    <h2>Sources</h2>
    <ul class="sources" id="sources"></ul>
  </section>
  <p class="foot" id="foot"></p>
</main>

<script src="vendor/d3/d3-array.min.js"></script>
<script src="vendor/d3/d3-geo.min.js"></script>
<script src="vendor/topojson/topojson-client.min.js"></script>
<script type="module" src="js/card.js?v=cards-5"></script>
</body>
</html>
